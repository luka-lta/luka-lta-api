; Projekt-Assets werden bis 5 MiB akzeptiert (ProjectAssetService::MAX_FILE_SIZE).
; Ohne diese Werte bremst PHP vorher: der Default upload_max_filesize ist 2M,
; womit das Limit der Anwendung nie erreicht wird.
upload_max_filesize = 5M

; Muss ueber upload_max_filesize liegen, damit neben der Datei noch die
; uebrigen Multipart-Felder in den Request passen.
post_max_size = 8M
